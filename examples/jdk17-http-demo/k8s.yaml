apiVersion: apps/v1
kind: Deployment
metadata:
  name: jdk17-http-demo
  labels:
    app.kubernetes.io/name: jdk17-http-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jdk17-http-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jdk17-http-demo
        java-profiler.io/profile-mode: temporary
      annotations:
        java-profiler.io/profile-mode: temporary
        java-profiler.io/profile-duration: 1h
        java-profiler.io/startup-delay: 0s
        java-profiler.io/snapshot-interval: 10s
    spec:
      containers:
        - name: app
          image: jdk17-http-demo:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: jdk17-http-demo
spec:
  selector:
    app.kubernetes.io/name: jdk17-http-demo
  ports:
    - name: http
      port: 8080
      targetPort: http
